<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 400px;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: #07C160;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 36px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .wechat-btn {
            background: #07C160;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            width: 100%;
            max-width: 250px;
        }

        .wechat-btn:hover {
            background: #06AD56;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(7, 193, 96, 0.3);
        }

        .wechat-btn i {
            margin-right: 10px;
            font-size: 20px;
        }

        .user-info {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: left;
        }

        .user-info h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-right: 15px;
            float: left;
        }

        .user-details {
            overflow: hidden;
        }

        .loading {
            display: none;
            margin-top: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #07C160;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="logo">微</div>
    <h1>微信登录</h1>
    <p>使用微信扫码登录，安全便捷</p>

    <button id="wechatLogin" class="wechat-btn">
        <i>微</i> 微信登录
    </button>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="margin-top: 10px;">正在跳转微信...</p>
    </div>

    <div class="user-info" id="userInfo" style="display: none;">
        <h3>登录成功</h3>
        <img id="userAvatar" class="user-avatar" src="" alt="用户头像">
        <div class="user-details">
            <p><strong>昵称：</strong><span id="userNickname"></span></p>
            <p><strong>OpenID：</strong><span id="userOpenId"></span></p>
        </div>
        <div style="clear: both;"></div>
    </div>
</div>

<script>
    document.getElementById('wechatLogin').addEventListener('click', function() {
        const loading = document.getElementById('loading');
        loading.style.display = 'block';

        // 获取微信登录URL
        fetch('/api/wechat/auth-url')
            .then(response => response.json())
            .then(data => {
                // 跳转到微信登录页面
                window.location.href = data.authUrl;
            })
            .catch(error => {
                console.error('Error:', error);
                loading.style.display = 'none';
                alert('获取登录链接失败，请重试');
            });
    });

    // 检查URL参数，判断是否是微信回调
    function getUrlParameter(name) {
        name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
        const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
        const results = regex.exec(location.search);
        return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    }

    // 页面加载时检查是否有code参数（微信回调）
    window.onload = function() {
        const code = getUrlParameter('code');
        const state = getUrlParameter('state');

        if (code && state) {
            // 显示加载状态
            document.getElementById('loading').style.display = 'block';
            document.getElementById('wechatLogin').style.display = 'none';

            // 发送请求处理微信回调
            fetch(`/api/wechat/callback?code=${code}&state=${state}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';

                    if (data.token) {
                        // 登录成功，显示用户信息
                        document.getElementById('userInfo').style.display = 'block';
                        document.getElementById('userAvatar').src = data.userInfo.headimgurl;
                        document.getElementById('userNickname').textContent = data.userInfo.nickname;
                        document.getElementById('userOpenId').textContent = data.userInfo.openid;

                        // 保存token到localStorage
                        localStorage.setItem('wechatToken', data.token);
                    } else {
                        alert('登录失败: ' + (data.message || '未知错误'));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('loading').style.display = 'none';
                    alert('登录处理失败，请重试');
                });
        }
    };
</script>
</body>
</html>
