server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tourist_management?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
    username: root
    password: 123456
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    enabled: true
  packages-to-scan: com.febuki.tool.server.controller

file:
  upload-url: https://image.lemorica.cn/
  upload-dir: A:/s/projectDevelopment/upload
  access-url: http://localhost:8080/avatars/


wechat:
  app-id: wxb7102cf837f390cc
  app-secret: ${WECHAT_APP_SECRET:}
  auth-url: https://api.weixin.qq.com/sns/jscode2session

juhe:
  scenic-apikey: ${JUHE_SCENIC_API_KEY:}
  train-apikey: ${JUHE_TRAIN_API_KEY:}
  url: https://apis.juhe.cn/

# 自定义缓存配置
app:
  cache:
    wechat:
      # 微信session_key缓存7天
      session-key-expire: 604800
    sms:
      # 短信验证码缓存5分钟
      code-expire: 300s

# 日志配置
logging:
  level:
    com.febuki.tool.server.service.cache: INFO
    com.febuki.tool.server.service.impl.WeChatAuthServerImpl: DEBUG